<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FF4D8D">
<title>Para Gabi 💘</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💘</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #FF4D8D;
    --pink-soft: #FF9DC4;
    --berry: #831843;
    --lilac: #C084FC;
    --gold: #FFD93D;
    --coral: #FF8552;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Quicksand', system-ui, sans-serif;
    background: linear-gradient(135deg, #FFE3F1 0%, #FFC4DD 45%, #FFB3D9 100%);
    color: var(--berry);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* ---------- ambient layers ---------- */
  #hearts-bg { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .float-heart {
    position: absolute; bottom: -8vh; pointer-events: none;
    animation: floatUp linear forwards;
    will-change: transform;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) translateX(0) rotate(-8deg) scale(var(--s)); opacity: 0; }
    8%   { opacity: var(--o); }
    50%  { transform: translateY(-55vh) translateX(var(--sway)) rotate(10deg) scale(var(--s)); }
    92%  { opacity: var(--o); }
    100% { transform: translateY(-115vh) translateX(calc(var(--sway) * -0.6)) rotate(-6deg) scale(var(--s)); opacity: 0; }
  }

  .trail-heart {
    position: fixed; pointer-events: none; z-index: 40;
    animation: trailUp .9s ease-out forwards;
    will-change: transform, opacity;
  }
  @keyframes trailUp {
    to { transform: translateY(-46px) scale(1.5) rotate(14deg); opacity: 0; }
  }

  /* ---------- scenes ---------- */
  .scene {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center;
    padding: 20px;
    transition: opacity .45s ease, transform .45s var(--spring);
  }
  .scene.leaving { opacity: 0; transform: scale(.82) rotate(-2deg); pointer-events: none; }
  .scene[hidden] { display: none; }

  .card {
    width: min(620px, 100%);
    background: rgba(255, 255, 255, .88);
    backdrop-filter: blur(10px);
    border-radius: 36px;
    border: 3px solid #fff;
    box-shadow: 0 24px 60px -18px rgba(255, 77, 141, .45), 0 0 0 8px rgba(255,255,255,.18);
    padding: 40px 32px 36px;
    text-align: center;
    animation: cardIn .9s var(--spring) both;
  }
  @keyframes cardIn {
    from { transform: translateY(40px) scale(.7) rotate(-4deg); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  .face {
    font-size: 88px; line-height: 1;
    filter: drop-shadow(0 6px 14px rgba(255,77,141,.35));
    animation: faceBob 2.2s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes faceBob {
    0%, 100% { transform: translateY(0) rotate(-4deg) scale(1); }
    50%      { transform: translateY(-10px) rotate(4deg) scale(1.06); }
  }
  .face.pop { animation: facePop .5s var(--spring), faceBob 2.2s .5s ease-in-out infinite; }
  @keyframes facePop { from { transform: scale(.3) rotate(-30deg); } }

  .eyebrow {
    display: inline-block;
    margin-top: 18px;
    font-family: 'Fredoka', sans-serif; font-weight: 600;
    font-size: 13px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--pink);
    background: rgba(255, 77, 141, .1);
    border: 1.5px solid rgba(255, 77, 141, .35);
    padding: 7px 16px; border-radius: 999px;
  }

  h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 6.4vw, 46px);
    line-height: 1.18;
    margin: 16px 0 10px;
    color: var(--berry);
  }
  h1 .w { display: inline-block; white-space: nowrap; }
  h1 .l {
    display: inline-block;
    letter-spacing: .02em;
    animation: letterIn .7s var(--spring) both;
    animation-delay: var(--d);
  }
  @keyframes letterIn {
    from { transform: translateY(.7em) scale(.3) rotate(-14deg); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  .tease {
    min-height: 26px;
    font-weight: 600; font-size: 15px;
    color: #B03060;
    opacity: 0; transform: translateY(6px);
    transition: opacity .3s, transform .3s var(--spring);
  }
  .tease.show { opacity: 1; transform: none; }

  .buttons {
    display: flex; gap: 18px; justify-content: center; align-items: center;
    margin-top: 22px; flex-wrap: wrap;
  }

  button {
    font-family: 'Fredoka', sans-serif; font-weight: 600;
    border: none; cursor: pointer; border-radius: 999px;
    transition: transform .3s var(--spring), box-shadow .3s, left .38s var(--spring), top .38s var(--spring);
  }
  #btn-yes {
    font-size: 22px; padding: 18px 46px;
    color: #fff;
    background: linear-gradient(135deg, #FF4D8D, #FF6BA0);
    box-shadow: 0 10px 24px -8px rgba(255,77,141,.7), inset 0 -3px 0 rgba(0,0,0,.12);
    animation: btnIn .6s var(--spring) .55s backwards, yesPulse 1.6s 1.2s ease-in-out infinite;
  }
  @keyframes btnIn { from { transform: scale(0) rotate(-16deg); } }
  @keyframes yesPulse {
    0%, 100% { box-shadow: 0 10px 24px -8px rgba(255,77,141,.7), inset 0 -3px 0 rgba(0,0,0,.12); }
    50%      { box-shadow: 0 10px 34px -4px rgba(255,77,141,.9), 0 0 0 10px rgba(255,77,141,.12), inset 0 -3px 0 rgba(0,0,0,.12); }
  }
  #btn-yes:hover { transform: translateY(-3px) scale(var(--yes-scale, 1.04)) !important; }
  #btn-yes:active { transform: scale(.93); }

  #btn-no {
    font-size: 18px; padding: 14px 34px;
    color: var(--berry);
    background: #fff;
    border: 2.5px solid #FFD1E8;
    box-shadow: 0 6px 16px -8px rgba(131,24,67,.4);
    animation: btnIn .6s var(--spring) .7s backwards;
  }
  #btn-no.surrendered {
    background: linear-gradient(135deg, var(--coral), var(--pink));
    color: #fff; border-color: transparent;
    box-shadow: 0 10px 24px -8px rgba(255,77,141,.7);
  }

  /* ---------- celebration ---------- */
  #scene-yes .card { max-height: 92vh; overflow-y: auto; }
  .photo-frame {
    position: relative; display: inline-block;
    transform: rotate(-2.5deg);
    animation: photoIn 1s var(--spring) .2s both;
  }
  @keyframes photoIn { from { transform: scale(.3) rotate(10deg); opacity: 0; } }
  .photo-frame img {
    display: block;
    width: min(300px, 62vw);
    border-radius: 22px;
    border: 8px solid #fff;
    box-shadow: 0 20px 44px -14px rgba(131,24,67,.5);
  }
  .photo-frame::after {
    content: '💖';
    position: absolute; top: -20px; right: -20px;
    font-size: 44px;
    transform: rotate(12deg);
    filter: drop-shadow(0 4px 8px rgba(255,77,141,.5));
    animation: faceBob 2s ease-in-out infinite;
  }

  #scene-yes h1 { margin-top: 20px; }
  #scene-yes .msg {
    font-size: 17px; font-weight: 500; line-height: 1.5;
    max-width: 44ch; margin: 6px auto 0;
    color: #9C2B5E;
  }

  .counter-label {
    margin-top: 22px;
    font-family: 'Fredoka', sans-serif; font-weight: 600;
    font-size: 13px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--lilac);
  }
  .chips { display: flex; gap: 10px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
  .chip {
    background: linear-gradient(160deg, #FFF0F6, #FFE0EF);
    border: 2px solid #FFC4DD;
    border-radius: 18px;
    padding: 10px 14px;
    min-width: 76px;
  }
  .chip b {
    display: block;
    font-family: 'Fredoka', sans-serif; font-weight: 700;
    font-size: 26px; color: var(--pink);
    font-variant-numeric: tabular-nums;
  }
  .chip span { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--berry); opacity: .75; }

  .tick {
    margin-top: 12px;
    font-family: 'Fredoka', sans-serif; font-weight: 600;
    font-size: 19px; color: var(--berry);
    font-variant-numeric: tabular-nums;
  }
  .anniv { color: var(--coral); }

  .sign {
    margin-top: 20px;
    font-family: 'Caveat', 'Quicksand', cursive;
    font-size: 24px; font-weight: 600;
    color: var(--pink);
    transform: rotate(-2deg);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div id="hearts-bg" aria-hidden="true"></div>

<main class="scene" id="scene-ask">
  <div class="card">
    <span class="face" id="face">🥰</span>
    <div><span class="eyebrow">Juani ♥ Gabi · 12.10.2024</span></div>
    <h1 id="question"></h1>
    <p class="tease" id="tease"></p>
    <div class="buttons">
      <button id="btn-yes">¡Sí! 💖</button>
      <button id="btn-no">No</button>
    </div>
  </div>
</main>

<main class="scene" id="scene-yes" hidden>
  <div class="card">
    <div class="photo-frame"><img id="photo" alt="Juani y Gabi"></div>
    <h1>¡Sabía que iba a ser que sí! 🥳</h1>
    <p class="msg">Te amo, Gabi. Gracias por estos años increíbles — que sean muchos más, princesa.</p>
    <div class="counter-label">Llevamos juntos</div>
    <div class="chips">
      <div class="chip"><b id="c-y">0</b><span>años</span></div>
      <div class="chip"><b id="c-m">0</b><span>meses</span></div>
      <div class="chip"><b id="c-d">0</b><span>días</span></div>
    </div>
    <div class="tick"><span id="c-hms">0:00:00</span> <span class="anniv" id="anniv"></span></div>
    <div class="sign">Con todo mi amor, Juani 💌</div>
  </div>
</main>

<script>
(() => {
  'use strict';

  /* ============ config ============ */
  const START = new Date(2024, 9, 12); // 12 de octubre de 2024
  const QUESTION = 'Gabi, ¿querés seguir siendo mi novia durante muchos años más?';
  const COLORS = ['#FF4D8D', '#FF9DC4', '#C084FC', '#FFD93D', '#FF8552', '#FFFFFF'];
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const NO_LABELS = ['No', '¿Segura? 🥺', '¿En serio? 😢', 'Pensalo bien 💭', 'Me estás rompiendo el corazón 💔', 'Último aviso 🙏', 'Dale, decí que sí 😭'];
  const TEASES    = ['', 'Ese botón no funciona 😏', 'El destino ya eligió ✨', 'Ni con el dedo más rápido 🏃‍♀️', 'Ya fue, aceptalo 💘', 'Casi no se ve el botón 🤏', 'El universo conspira a mi favor 🌟'];
  const FACES     = ['🥰', '😳', '🥺', '😢', '😭', '💔', '🫠', '🙏'];
  const SURRENDER_AT = NO_LABELS.length - 1; // dodge count that makes No give up

  const $ = id => document.getElementById(id);
  const faceEl = $('face'), teaseEl = $('tease');
  const yesBtn = $('btn-yes'), noBtn = $('btn-no');

  /* ============ question: letter stagger ============ */
  {
    const h1 = $('question');
    let i = 0;
    for (const word of QUESTION.split(' ')) {
      const w = document.createElement('span');
      w.className = 'w';
      for (const ch of word) {
        const l = document.createElement('span');
        l.className = 'l';
        l.style.setProperty('--d', (i++ * 34) + 'ms');
        l.textContent = ch;
        w.appendChild(l);
      }
      h1.append(w, ' ');
    }
  }

  /* ============ floating hearts background ============ */
  if (!REDUCED) {
    const bg = $('hearts-bg');
    const glyphs = ['💗', '💖', '💕', '💘', '🩷', '✨'];
    const spawn = () => {
      if (bg.childElementCount > 22) return;
      const h = document.createElement('span');
      h.className = 'float-heart';
      h.textContent = glyphs[Math.random() * glyphs.length | 0];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.fontSize = (14 + Math.random() * 30) + 'px';
      h.style.setProperty('--s', (0.6 + Math.random() * 0.8).toFixed(2));
      h.style.setProperty('--o', (0.25 + Math.random() * 0.5).toFixed(2));
      h.style.setProperty('--sway', (Math.random() * 90 - 45).toFixed(0) + 'px');
      h.style.animationDuration = (7 + Math.random() * 7).toFixed(1) + 's';
      h.addEventListener('animationend', () => h.remove());
      bg.appendChild(h);
    };
    for (let i = 0; i < 8; i++) setTimeout(spawn, i * 350);
    setInterval(spawn, 800);
  }

  /* ============ cursor heart trail ============ */
  if (!REDUCED) {
    let last = 0;
    const glyphs = ['💖', '💕', '✨', '💗'];
    addEventListener('pointermove', e => {
      const now = performance.now();
      if (now - last < 55) return;
      last = now;
      const t = document.createElement('span');
      t.className = 'trail-heart';
      t.textContent = glyphs[Math.random() * glyphs.length | 0];
      t.style.left = e.clientX - 8 + 'px';
      t.style.top = e.clientY - 8 + 'px';
      t.style.fontSize = (10 + Math.random() * 14) + 'px';
      t.addEventListener('animationend', () => t.remove());
      document.body.appendChild(t);
    }, { passive: true });
  }

  /* ============ the fleeing "No" ============ */
  let dodges = 0, fleeing = false, surrendered = false, lastDodge = 0;

  const viewport = () => {
    const vv = window.visualViewport;
    return vv ? { w: vv.width, h: vv.height } : { w: innerWidth, h: innerHeight };
  };

  const pointerPos = e => {
    const t = e.touches && e.touches[0];
    return t ? { x: t.clientX, y: t.clientY } : { x: e.clientX, y: e.clientY };
  };

  function dodge(e) {
    if (surrendered) return;
    if (e.cancelable) e.preventDefault();
    const t = performance.now();
    if (t - lastDodge < 300) return;
    lastDodge = t;
    dodges++;

    if (!fleeing) {
      fleeing = true;
      const r = noBtn.getBoundingClientRect();
      document.body.appendChild(noBtn);
      Object.assign(noBtn.style, {
        position: 'fixed', left: r.left + 'px', top: r.top + 'px',
        margin: 0, zIndex: 60
      });
      void noBtn.offsetWidth;
    }

    // escalating labels / face / tease
    const i = Math.min(dodges, NO_LABELS.length - 1);
    noBtn.textContent = NO_LABELS[i];
    teaseEl.textContent = TEASES[Math.min(dodges, TEASES.length - 1)];
    teaseEl.classList.add('show');
    faceEl.textContent = FACES[Math.min(dodges, FACES.length - 1)];
    faceEl.classList.remove('pop'); void faceEl.offsetWidth; faceEl.classList.add('pop');

    // yes grows, no shrinks + wobbles
    const yesScale = Math.min(1 + dodges * 0.2, 2.1);
    yesBtn.style.transform = `scale(${yesScale})`;
    yesBtn.style.setProperty('--yes-scale', yesScale);
    const noScale = Math.max(1 - dodges * 0.11, 0.4);
    const wobble = (Math.random() * 24 - 12).toFixed(0);

    // teleport far from the pointer, inside the viewport
    const p = pointerPos(e);
    const pad = 14;
    const { w: vw, h: vh } = viewport();
    const bw = noBtn.offsetWidth, bh = noBtn.offsetHeight;
    let x, y, tries = 0;
    do {
      x = pad + Math.random() * Math.max(vw - bw - pad * 2, 0);
      y = pad + Math.random() * Math.max(vh - bh - pad * 2, 0);
      tries++;
    } while (tries < 12 && Math.hypot(x + bw / 2 - p.x, y + bh / 2 - p.y) < 170);

    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
    noBtn.style.transform = `scale(${noScale}) rotate(${wobble}deg)`;

    if (dodges >= SURRENDER_AT) {
      setTimeout(() => {
        surrendered = true;
        noBtn.classList.add('surrendered');
        noBtn.textContent = 'Sí, obvio 💘';
        noBtn.style.transform = 'scale(1.15) rotate(-4deg)';
        teaseEl.textContent = 'Se rindió el botón, como debe ser 😌';
        faceEl.textContent = '😏';
        faceEl.classList.remove('pop'); void faceEl.offsetWidth; faceEl.classList.add('pop');
      }, 450);
    }
  }

  for (const ev of ['pointerdown', 'touchstart', 'click']) {
    noBtn.addEventListener(ev, e => { if (!surrendered) dodge(e); });
  }
  noBtn.addEventListener('click', e => { if (surrendered) celebrate(); });

  /* ============ celebration ============ */
  const heartShape = confetti.shapeFromPath({
    path: 'M167 72c19,-38 37,-56 75,-56 42,0 76,33 76,75 0,76 -76,151 -151,227 -76,-76 -151,-151 -151,-227 0,-42 33,-75 75,-75 38,0 57,18 76,56z'
  });
  const emojiShape = t => confetti.shapeFromText({ text: t, scalar: 2 });
  const heartEmojis = ['❤️', '💖', '💘', '💝'].map(emojiShape);

  function boom() {
    confetti({
      particleCount: 90, spread: 360, startVelocity: 42, scalar: 1.6,
      shapes: [heartShape, ...heartEmojis], colors: COLORS, origin: { y: 0.45 }, zIndex: 100
    });
    confetti({ particleCount: 160, spread: 110, startVelocity: 55, colors: COLORS, origin: { y: 0.4 }, zIndex: 100 });
    const end = Date.now() + 3500;
    (function cannons() {
      confetti({ particleCount: 6, angle: 60,  spread: 60, origin: { x: 0, y: 0.7 }, colors: COLORS, zIndex: 100 });
      confetti({ particleCount: 6, angle: 120, spread: 60, origin: { x: 1, y: 0.7 }, colors: COLORS, zIndex: 100 });
      if (Date.now() < end) requestAnimationFrame(cannons);
    })();
    setInterval(() => confetti({
      particleCount: 14, spread: 100, startVelocity: 34, scalar: 1.4,
      shapes: [heartShape], colors: COLORS, origin: { y: 0.6, x: Math.random() }, zIndex: 100
    }), 9000);
  }

  /* ============ live counter ============ */
  const pad2 = n => String(n).padStart(2, '0');
  function tick() {
    const now = new Date();
    let y = now.getFullYear() - START.getFullYear();
    let m = now.getMonth() - START.getMonth();
    let d = now.getDate() - START.getDate();
    if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
    if (m < 0) { y--; m += 12; }
    const base = new Date(START); base.setFullYear(START.getFullYear() + y); base.setMonth(START.getMonth() + m); base.setDate(START.getDate() + d);
    const rem = Math.max(0, now - base);
    const hh = Math.floor(rem / 3.6e6), mm = Math.floor(rem / 6e4) % 60, ss = Math.floor(rem / 1e3) % 60;

    $('c-y').textContent = y;
    $('c-m').textContent = m;
    $('c-d').textContent = d;
    $('c-hms').textContent = `y ${hh}h ${pad2(mm)}m ${pad2(ss)}s más 💕`;

    const anniv = $('anniv');
    if (m === 0 && d === 0) anniv.textContent = now.getMonth() === START.getMonth() ? '· ¡Feliz aniversario, princesa! 🎂' : '· ¡Mesiversario! 🎉';
  }

  function celebrate() {
    if (celebrate.done) return;
    celebrate.done = true;
    const ask = $('scene-ask'), yes = $('scene-yes');
    ask.classList.add('leaving');
    setTimeout(() => {
      ask.hidden = true;
      noBtn.style.display = 'none';
      yes.hidden = false;
      boom();
      tick();
      setInterval(tick, 1000);
    }, 380);
  }
